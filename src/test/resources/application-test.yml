eventops:
  notificacoes:
    ativas: false
    intervalo: 1h
    maximo-tentativas: 3
  url-publica: http://localhost:8081

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18082/realms/eventops
          jwk-set-uri: http://localhost:18082/realms/eventops/protocol/openid-connect/certs
