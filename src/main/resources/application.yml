spring:
  application:
    name: eventops
  datasource:
    url: ${EVENTOPS_BANCO_URL:jdbc:postgresql://localhost:54324/eventops}
    username: ${EVENTOPS_BANCO_USUARIO:eventops}
    password: ${EVENTOPS_BANCO_SENHA:eventops}
    hikari:
      maximum-pool-size: ${EVENTOPS_TAMANHO_POOL:15}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${EVENTOPS_EMISSOR_JWT:http://localhost:18082/realms/eventops}
          jwk-set-uri: ${EVENTOPS_URL_CHAVES_JWK:http://localhost:18082/realms/eventops/protocol/openid-connect/certs}
  mail:
    host: ${EVENTOPS_EMAIL_HOST:localhost}
    port: ${EVENTOPS_EMAIL_PORTA:11025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  threads:
    virtual:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

eventops:
  url-publica: ${EVENTOPS_URL_PUBLICA:http://localhost:8081}
  observabilidade:
    usuario: ${EVENTOPS_OBSERVABILIDADE_USUARIO:prometheus}
    senha: ${EVENTOPS_OBSERVABILIDADE_SENHA}
  notificacoes:
    ativas: ${EVENTOPS_NOTIFICACOES_ATIVAS:true}
    intervalo: ${EVENTOPS_NOTIFICACOES_INTERVALO:5s}
    maximo-tentativas: ${EVENTOPS_NOTIFICACOES_MAXIMO_TENTATIVAS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    oauth:
      client-id: eventops-swagger
      use-pkce-with-authorization-code-grant: true

logging:
  pattern:
    level: "%5p [idCorrelacao=%X{idCorrelacao:-}] [usuario=%X{usuario:-}]"
